services:
  annotate:
    build: .
    read_only: true
    ports:
      - "127.0.0.1:24173:24173"
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:24173
      Annotate__DataDir: /data
      Annotate__OpenBrowser: "false"
      HOME: /tmp
    volumes:
      - annotate-data:/data
    tmpfs:
      - /tmp

volumes:
  annotate-data:
